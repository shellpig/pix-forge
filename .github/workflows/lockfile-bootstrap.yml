name: Temporary lockfile bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  resolve-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Verify reproducible clean install
        run: npm ci --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit verified npm lockfile"
          git push

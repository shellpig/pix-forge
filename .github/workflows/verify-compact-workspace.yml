name: Temporary compact workspace verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-compact-workspace.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: All regression tests
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Vite production build
        run: npm run build
      - name: Verify output assets and Worker
        run: |
          test -f dist/index.html
          test -f dist/src/assets/images/sample_rpg_knight_1795397004570.jpg
          test -f dist/src/assets/images/sample_fantasy_tavern_1795397003478.jpg
          find dist -type f | grep -E 'pixelConversion.worker|worker-'
      - name: Wrangler dry-run
        run: npx --no-install wrangler deploy --dry-run
      - name: Check no Cloudflare auto Vite configuration added
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const v=readFileSync('vite.config.ts','utf8');
          assert.ok(v.includes('copy-unbundled-src-assets'));
          assert.ok(!v.includes('@cloudflare/vite-plugin'));
          NODE

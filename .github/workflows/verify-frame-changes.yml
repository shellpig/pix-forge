name: Temporary animation regression verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-frame-changes.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify frame workflow changes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app = fs.readFileSync('src/App.tsx', 'utf8');
          const viewport = fs.readFileSync('src/components/CanvasViewport.tsx', 'utf8');
          assert.ok(app.includes("frames.map((f) => f.id).sort().join('|')"), 'Stable membership key missing');
          assert.equal(['c','a','b'].sort().join('|'), ['a','b','c'].sort().join('|'), 'Reorder should not change membership key');
          assert.match(app, /mode === 'append'[\s\S]*?setHasPendingReconvert\(true\)/, 'Append should warn on manual edits');
          assert.match(app, /const handleDeleteFrame[\s\S]*?setHasPendingReconvert\(true\)/, 'Delete should warn on surviving manual edits');
          assert.ok(viewport.includes('轉換參數或動畫影格已變更'), 'Notice copy should describe frame changes');
          console.log('Animation regression guards passed');
          NODE

name: Temporary isolated-alpha edge regression verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-isolated-alpha-edge.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all regression tests
        run: npm test
      - name: TypeScript check
        run: npm run lint
      - name: Production Vite build
        run: npm run build
      - name: Check browser Worker and example images in build
        run: |
          test -f dist/index.html
          test -f dist/src/assets/images/sample_rpg_knight_1795397004570.jpg
          test -f dist/src/assets/images/sample_fantasy_tavern_1795397003478.jpg
          find dist -type f | grep -E 'pixelConversion.worker|worker-'
      - name: Wrangler deploy dry-run
        run: npx --no-install wrangler deploy --dry-run

name: Temporary isolated-pixel revised rules verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-isolated-rules.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all regression tests including revised cleanup tests
        run: npm test
      - name: Run TypeScript check
        run: npm run lint
      - name: Run production build
        run: npm run build
      - name: Verify browser Worker and example assets in production
        run: |
          test -f dist/index.html
          test -f dist/src/assets/images/sample_rpg_knight_1795397004570.jpg
          test -f dist/src/assets/images/sample_fantasy_tavern_1795397003478.jpg
          find dist -type f | grep -E 'pixelConversion.worker|worker-'
      - name: Wrangler deploy dry-run (no actual deployment)
        run: npx --no-install wrangler deploy --dry-run
      - name: Check UI and docs contain new rules
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const helper=fs.readFileSync('src/lib/isolatedPixels.ts','utf8');
          assert.ok(helper.includes('minCandidateCount: 4'));
          assert.ok(helper.includes('minCandidateCount: 3'));
          assert.ok(helper.includes('LOCAL_EXTREME_L_MARGIN = 0.12'));
          const ui=fs.readFileSync('src/components/ControlPanel.tsx','utf8');
          assert.ok(ui.includes('至少 4 次'));
          assert.ok(ui.includes('至少 3 次'));
          assert.ok(fs.readFileSync('README.md','utf8').includes('色差 ≤0.3'));
          assert.ok(fs.readFileSync('README.en.md','utf8').includes('distance ≤0.3'));
          NODE

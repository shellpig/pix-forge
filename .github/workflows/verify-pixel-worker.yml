name: Temporary Worker build verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pixel-worker.yml'

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify locked clean dependency install
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run lint
      - name: Build Vite application and module Worker
        run: npm run build
      - name: Check Worker emitted in production output
        run: |
          find dist -type f | grep -E 'pixelConversion.worker|worker-' || {
            echo 'Worker bundle not found in production dist.'
            find dist -type f
            exit 1
          }

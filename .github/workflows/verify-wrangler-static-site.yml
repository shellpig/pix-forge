name: Temporary Wrangler static-site verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-wrangler-static-site.yml'

permissions:
  contents: write

jobs:
  validate-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Generate verified Wrangler lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Reproducible dependency install
        run: npm ci --no-audit --no-fund
      - name: Check pinned Wrangler version
        run: |
          npx --no-install wrangler --version
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(pkg.devDependencies.wrangler,'4.166.0');
          assert.equal(lock.packages[''].devDependencies.wrangler,'4.166.0');
          assert.equal(lock.packages['node_modules/wrangler'].version,'4.166.0');
          assert.equal(config.name,'pix-forge');
          assert.equal(config.compatibility_date,'2026-11-23');
          assert.equal(config.assets.directory,'./dist');
          assert.equal(config.main,undefined);
          assert.equal(fs.readFileSync('.node-version','utf8').trim(),'22');
          NODE
      - name: Existing regression tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run lint
      - name: Existing Vite production build (includes image copies and browser worker)
        run: npm run build
      - name: Verify static assets and browser worker retained
        run: |
          test -f dist/index.html
          test -f dist/src/assets/images/sample_rpg_knight_1795397004570.jpg
          test -f dist/src/assets/images/sample_fantasy_tavern_1795397003478.jpg
          find dist -type f | grep -E 'pixelConversion.worker|worker-' 
      - name: Dry-run Wrangler deploy without Cloudflare authentication
        run: npx --no-install wrangler deploy --dry-run
      - name: Confirm no auto-configuration altered the project
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const v=fs.readFileSync('vite.config.ts','utf8');
          assert.ok(v.includes('copy-unbundled-src-assets'));
          assert.ok(!v.includes('@cloudflare/vite-plugin'));
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          assert.ok(!p.dependencies?.['@cloudflare/vite-plugin']);
          assert.ok(!p.devDependencies?.['@cloudflare/vite-plugin']);
          NODE
          git diff --exit-code -- package.json vite.config.ts wrangler.jsonc
      - name: Commit verified package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock Wrangler 4.166.0 for static Workers deployments"
          git push

name: Pix-Forge verification

on:
  push:
    branches:
      - main
      - feat/document-palette-phase-2c
      - feat/document-palette-phase-3a
      - feat/document-palette-phase-3b
      - feat/document-palette-phase-4a
      - feat/document-palette-phase-4b
  pull_request:
    branches:
      - main
      - feat/document-palette-phase-2b
      - feat/document-palette-phase-3a
      - feat/document-palette-phase-4a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
